<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Reflexion Cockpit — Steam Gauge Edition</title>
<style>
  body { background: #111; color: #eee; font-family: monospace; }
  h1 { color: #0f0; }
  .panel { display: flex; flex-wrap: wrap; gap: 20px; }
  .gauge {
    width: 120px; height: 120px;
    border: 4px solid #333;
    border-radius: 50%;
    background: radial-gradient(#222, #000);
    position: relative;
    box-shadow: inset 0 0 20px #000, 0 0 10px #000;
  }
  .gauge .label {
    position: absolute;
    bottom: 5px; width: 100%;
    text-align: center;
    font-size: 12px;
    color: #ccc;
  }
  .needle {
    width: 2px; height: 50%;
    background: red;
    position: absolute;
    top: 10%; left: 50%;
    transform-origin: bottom center;
    transition: transform 0.3s ease-out;
  }
  .center-cap {
    width: 12px; height: 12px;
    background: #666;
    border-radius: 50%;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 3px #000;
  }
  .state-light {
    width: 20px; height: 20px;
    border-radius: 50%;
    margin: 0 auto;
    box-shadow: 0 0 5px #000;
  }
  .COLD { background: #004477; }
  .WARM { background: #aa7700; }
  .HOT  { background: #aa0000; }
  #events {
    height: 150px; overflow-y: scroll;
    background: #000; padding: 5px;
    font-size: 12px; border: 1px solid #333;
  }
</style>
</head>
<body>

<h1>🛫 Reflexion Diagnostic Cockpit</h1>
<div id="heartbeat">Heartbeat: --</div>

<div class="panel" id="gaugesPanel">
  <!-- Gauges will be injected here -->
</div>

<h2>Event Log</h2>
<div id="events"></div>

<script>
function createGauge(symbol, label) {
  const gauge = document.createElement('div');
  gauge.className = 'gauge';
  gauge.innerHTML = `
    <div class="needle" id="${symbol}-${label}-needle"></div>
    <div class="center-cap"></div>
    <div class="label">${symbol} ${label}</div>
  `;
  return gauge;
}

function setNeedle(symbol, label, value, min, max) {
  const needle = document.getElementById(`${symbol}-${label}-needle`);
  if (!needle) return;
  const clamped = Math.max(min, Math.min(max, value || 0));
  const angle = ((clamped - min) / (max - min)) * 270 - 135; // sweep -135° to +135°
  needle.style.transform = `rotate(${angle}deg)`;
}

async function fetchData() {
  const [symbols, events, heartbeat] = await Promise.all([
    fetch('/symbols').then(r => r.json()),
    fetch('/events?limit=50').then(r => r.json()),
    fetch('/heartbeat').then(r => r.json())
  ]);

  document.getElementById('heartbeat').innerText =
    `Heartbeat: ${heartbeat.status} @ ${heartbeat.timestamp}`;

  const panel = document.getElementById('gaugesPanel');
  panel.innerHTML = '';

  symbols.forEach(s => {
    // State light
    const stateLight = document.createElement('div');
    stateLight.className = `state-light ${s.state}`;
    const stateLabel = document.createElement('div');
    stateLabel.style.textAlign = 'center';
    stateLabel.innerText = `${s.symbol} ${s.state}`;
    const stateContainer = document.createElement('div');
    stateContainer.appendChild(stateLight);
    stateContainer.appendChild(stateLabel);
    panel.appendChild(stateContainer);

    // Gauges for volatility, volume, momentum
    panel.appendChild(createGauge(s.symbol, 'Vol'));
    panel.appendChild(createGauge(s.symbol, 'Volu'));
    panel.appendChild(createGauge(s.symbol, 'Mom'));

    // Set needles
    setNeedle(s.symbol, 'Vol', s.volatility || 0, 0, 2);
    setNeedle(s.symbol, 'Volu', (s.volume || 0) / 1_000_000, 0, 5); // scale to M
    setNeedle(s.symbol, 'Mom', s.momentum || 0, -2, 2);
  });

  // Events log
  const eventsDiv = document.getElementById('events');
  eventsDiv.innerHTML = events.map(e =>
    `[${e.timestamp}] ${e.event_type}: ${e.symbol || ''}`
  ).join('<br>');
}

setInterval(fetchData, 1000);
fetchData();
</script>

</body>
</html>
