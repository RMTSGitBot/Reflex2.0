{% extends "base.html" %}
{% block content %}
<div class="container">
  <h2>📦 Backfill Loader</h2>
  <form method="post">
    <label for="mode">Backfill Mode:</label>
    <select name="mode" id="mode">
      <option value="full">Full</option>
      <option value="moderate">Moderate</option>
      <option value="recent" selected>Recent</option>
    </select>

    <label>Target:</label>
    <div class="radio-group">
      <label><input type="radio" name="target" value="single" id="single" onclick="toggleSymbolInput()" checked> Single Symbol</label>
      <label><input type="radio" name="target" value="all" id="all" onclick="toggleSymbolInput()"> All Symbols</label>
    </div>

    <div id="symbolInput">
      <label for="symbols">Symbol (e.g. AAPL):</label>
      <input type="text" name="symbols" id="symbols" placeholder="Enter symbol">
    </div>

    <button type="submit">Run Backfill</button>
  </form>

  {% if message %}
  <div class="message">{{ message }}</div>
  {% endif %}
</div>
<script>
  function toggleSymbolInput() {
    const singleRadio = document.getElementById("single");
    const symbolInput = document.getElementById("symbolInput");
    symbolInput.style.display = singleRadio.checked ? "block" : "none";
  }
  window.onload = toggleSymbolInput;
</script>
{% endblock %}
