{% extends "base.html" %}
{% block content %}
  <h1>🧬 Database Schema</h1>

  <table>
    <thead>
      <tr>
        <th>Column</th>
        <th>Type</th>
      </tr>
    </thead>
    <tbody>
      {% for col in schema %}
      <tr>
        <td>{{ col.column_name }}</td>
        <td>{{ col.data_type }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
