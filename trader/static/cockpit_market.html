<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reflexion Market Monitor</title>
  <style>
    body { background: #111; color: #eee; font-family: monospace; }
    h1 { color: #0ff; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #444; padding: 6px; text-align: center; }
  </style>
</head>
<body>

<h1>🌐 Market Conditions</h1>
<div id="market"></div>

<script>
async function loadMarket() {
  const data = await fetch('/market_conditions').then(r => r.json());
  let html = '<table><tr><th>Symbol</th><th>Spread</th><th>Volatility</th><th>Pressure</th></tr>';
  data.forEach(s => {
    html += `<tr>
      <td>${s.symbol}</td>
      <td>${s.spread.toFixed(2)}</td>
      <td>${s.volatility.toFixed(2)}</td>
      <td>${s.pressure}</td>
    </tr>`;
  });
  html += '</table>';
  document.getElementById('market').innerHTML = html;
}

setInterval(loadMarket, 3000);
loadMarket();
</script>

</body>
</html>
