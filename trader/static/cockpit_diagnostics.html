<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reflexion Diagnostics</title>
  <style>
    body { background: #111; color: #eee; font-family: monospace; }
    h1 { color: #0ff; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #444; padding: 6px; text-align: center; }
    .buy { color: #0f0; }
    .sell { color: #f00; }
    .neutral { color: #ccc; }
  </style>
</head>
<body>

<h1>📊 Reflexion Diagnostics</h1>
<div id="diagnostics"></div>

<script>
async function loadDiagnostics() {
  const data = await fetch('/market_conditions').then(r => r.json());
  let html = '<table><tr><th>Symbol</th><th>Volatility</th><th>Spread</th><th>Pressure</th><th>Last Update</th></tr>';
  data.forEach(d => {
    const cls = d.pressure === "buy" ? "buy" : d.pressure === "sell" ? "sell" : "neutral";
    html += `<tr>
      <td>${d.symbol}</td>
      <td>${d.volatility.toFixed(4)}</td>
      <td>${d.spread.toFixed(4)}</td>
      <td class="${cls}">${d.pressure}</td>
      <td>${d.timestamp || "—"}</td>
    </tr>`;
  });
  html += '</table>';
  document.getElementById('diagnostics').innerHTML = html;
}

setInterval(loadDiagnostics, 3000);
loadDiagnostics();
</script>

</body>
</html>
