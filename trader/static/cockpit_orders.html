<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reflexion Live Orders</title>
  <style>
    body { background: #111; color: #eee; font-family: monospace; }
    h1 { color: #ff0; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #444; padding: 6px; text-align: center; }
  </style>
</head>
<body>

<h1>📡 Live Orders</h1>
<div id="orders"></div>

<script>
async function loadOrders() {
  const data = await fetch('/live_orders').then(r => r.json());
  let html = '<table><tr><th>Symbol</th><th>Order ID</th><th>Submitted</th><th>Details</th></tr>';
  data.forEach(o => {
    html += `<tr>
      <td>${o.symbol}</td>
      <td>${o.details.order_id}</td>
      <td>${new Date(o.submitted).toLocaleString('en-US', { timeZone: 'America/New_York' })}</td>
      <td>${JSON.stringify(o.details)}</td>
    </tr>`;
  });
  html += '</table>';
  document.getElementById('orders').innerHTML = html;
}

setInterval(loadOrders, 3000);
loadOrders();
</script>

</body>
</html>
