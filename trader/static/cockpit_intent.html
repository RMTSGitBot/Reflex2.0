<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reflexion Trade Intent</title>
  <style>
    body { background: #111; color: #eee; font-family: monospace; }
    h1 { color: #0ff; }
    select, pre { font-family: monospace; font-size: 14px; }
    .pass { color: #0f0; }
    .fail { color: #f00; }
  </style>
</head>
<body>

<h1>🧠 Trade Intent Viewer</h1>

<label>Select Symbol:
  <select id="symbolSelect" onchange="loadIntent()"></select>
</label>

<h2>Model Snapshot</h2>
<pre id="snapshot"></pre>

<h2>Filter Status</h2>
<div id="filters"></div>

<script>
async function fetchSymbols() {
  const symbols = await fetch('/symbols').then(r => r.json());
  const select = document.getElementById('symbolSelect');
  select.innerHTML = '';
  symbols.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.symbol;
    opt.textContent = s.symbol;
    select.appendChild(opt);
  });
  loadIntent();
}

async function loadIntent() {
  const symbol = document.getElementById('symbolSelect').value;
  const data = await fetch(`/model_status?symbol=${symbol}`).then(r => r.json());

  document.getElementById('snapshot').textContent =
    JSON.stringify(data.snapshot, null, 2);

  const filters = data.model?.entry_model?.filters || [];
  const div = document.getElementById('filters');
  div.innerHTML = '';
  filters.forEach(f => {
    const field = f.field;
    const op = f.operator;
    const threshold = f.threshold;
    const value = data.snapshot[field];
    const passed = eval(`${value} ${op} ${threshold}`);
    const span = document.createElement('span');
    span.className = passed ? 'pass' : 'fail';
    span.textContent = `${field} ${op} ${threshold} → ${value} ${passed ? '✅' : '❌'}`;
    div.appendChild(span);
    div.appendChild(document.createElement('br'));
  });
}

fetchSymbols();
</script>

</body>
</html>
