<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reflexion Emergency Stop</title>
  <style>
    body { background: #111; color: #eee; font-family: monospace; text-align: center; }
    h1 { color: #f00; }
    button { font-size: 20px; padding: 10px 20px; background: #900; color: #fff; border: none; cursor: pointer; }
  </style>
</head>
<body>

<h1>🔥 EMERGENCY STOP</h1>
<p>This will cancel all orders and liquidate all positions across all brokers.</p>
<button onclick="triggerEmergency()">TRIGGER EMERGENCY STOP</button>
<div id="result"></div>

<script>
async function triggerEmergency() {
  const res = await fetch('/emergency_trigger', { method: 'POST' }).then(r => r.json());
  document.getElementById('result').innerText = JSON.stringify(res, null, 2);
}
</script>

</body>
</html>
