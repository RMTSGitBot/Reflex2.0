<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reflexion Portfolio</title>
  <style>
    body { background: #111; color: #eee; font-family: monospace; }
    h1 { color: #0f0; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #444; padding: 6px; text-align: center; }
    .gain { color: #0f0; }
    .loss { color: #f00; }
  </style>
</head>
<body>

<h1>📊 Reflexion Portfolio</h1>
<div id="portfolio"></div>

<script>
async function loadPortfolio() {
  const data = await fetch('/portfolio_status').then(r => r.json());
  let html = '<table><tr><th>Broker</th><th>Account</th><th>Symbol</th><th>Position</th><th>Avg Price</th><th>Closed Trades</th></tr>';
  for (const [key, symbols] of Object.entries(data)) {
    const [broker, account] = key.split(':');
    for (const [symbol, info] of Object.entries(symbols)) {
      const closed = info.closed.map(c => {
        const cls = c.pnl >= 0 ? 'gain' : 'loss';
        return `<span class="${cls}">${c.size} @ ${c.price} → ${c.pnl.toFixed(2)}</span>`;
      }).join('<br>');
      html += `<tr>
        <td>${broker}</td><td>${account}</td><td>${symbol}</td>
        <td>${info.position}</td><td>${info.avg_price.toFixed(2)}</td>
        <td>${closed}</td>
      </tr>`;
    }
  }
  html += '</table>';
  document.getElementById('portfolio').innerHTML = html;
}

setInterval(loadPortfolio, 3000);
loadPortfolio();
</script>

</body>
</html>
